{% block main_content %}
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-lg">
        <div class="card-header bg-primary text-white text-center">
          <h3>Login</h3>
        </div>
        <div class="card-body">
          <div id="formMessage" class="alert d-none"></div>
          <form id="loginInfo" method="POST" action="{% url 'spa_router' 'login' %}

">
            {% csrf_token %}
            <div class="mb-3">
              <label for="name" class="form-label">Username</label>
              <input type="text" id="name" name="name" class="form-control" placeholder="Enter username" />
              <div class="form-text text-danger error"></div>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" id="password" name="password" class="form-control" placeholder="Enter password" />
              <div class="form-text text-danger error"></div>
            </div>
            <div class="mb-3">
              <label for="captcha" class="form-label">Captcha</label>
              <div class="input-group">
                <input type="text" id="captcha" name="captcha" class="form-control" placeholder="Enter captcha" />
                <button type="button" id="refreshCaptchaBtn" class="btn btn-outline-secondary">Refresh</button>
              </div>
              <div id="captchaImage" class="mt-2">
                {{ captcha_code|safe }}
              </div>
              <div class="form-text text-danger error"></div>
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

{% endblock %}
