
{% block css %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<style>

    body {
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 0;
        background-color: #f8f9fa;
        color: #212529;
    }

    .main {
        padding: 15px;
        max-width: 1200px;
        margin: 0 auto;
    }

    h2, h3 {
        text-align: center;
        margin-bottom: 15px;
    }

    form#filterForm {
        display: flex;
        gap: 10px;
        margin-bottom: 15px;
        justify-content: center;
    }

    #searchInput {
        padding: 8px;
        width: 200px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }

    #searchBtn {
        padding: 8px 12px;
        background-color: #007bff;
        color: #fff;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }

    #searchBtn:hover {
        background-color: #0056b3;
    }

    #perPageSelect {
        padding: 8px;
        border: 1px solid #ccc;
        border-radius: 4px;
    }

    /* Table Styling */
    .table-responsive {
        width: 100%;
        overflow-x: auto;
       /* This enables users on small devices to scroll horizontally instead of breaking layout.*/
    }

    table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 15px;
    }

    th, td {
        padding: 10px;
        border: 1px solid #ddd;
        text-align: left;
    }

    th {
        background-color: #343a40;
        color: #fff;
        font-weight: 600;
    }

    tr:nth-child(even) {
        background-color: #f2f2f2;
    }

    tr:hover {
        background-color: #e9ecef;
    }

    /* Pagination */
    .pagination {
        text-align: center;
        margin-top: 10px;
    }

    .pagination a {
        margin: 0 5px;
        text-decoration: none;
        color: #007bff;
        padding: 6px 10px;
        border: 1px solid #007bff;
        border-radius: 4px;
        display: inline-block;
    }

    .pagination a:hover {
        background-color: #007bff;
        color: #fff;
    }

    .pagination span {
        margin: 0 5px;
        display: inline-block;
        padding: 6px 10px;
    }

    /* Actions link */
    td a {
        color: #dc3545;
        text-decoration: none;
    }

    td a:hover {
        text-decoration: underline;
    }

    /* Responsive Styles */
    @media (max-width: 768px) {
        form#filterForm {
            flex-direction: column;
            align-items: stretch;
        }

        #searchInput, #perPageSelect, #searchBtn {
            width: 100%;
        }

        th, td {
            font-size: 14px;
        }

        h2, h3 {
            font-size: 1.3em;
        }
    }

    @media (max-width: 480px) {
        th, td {
            font-size: 12px;
            padding: 6px;
        }

        #searchBtn {
            font-size: 14px;
        }

        .pagination a, .pagination span {
            font-size: 12px;
            padding: 4px 6px;
        }
    }
</style>
{% endblock %}

{% block main_content %}
<h2>Welcome Admin: {{ userdetails.userName }}</h2>
<h3>All Users</h3>

<div class="main">
    <form id="filterForm" method="get" onsubmit="return false;">
        <input type="text" name="search" id="searchInput" placeholder="Search username" value="{{ search_query }}">
        <button id="searchBtn">Search</button>
        <select name="per_page" id="perPageSelect">
            <option value="10" {% if per_page == '10' %}selected{% endif %}>10</option>
            <option value="35" {% if per_page == '35' %}selected{% endif %}>35</option>
            <option value="50" {% if per_page == '50' %}selected{% endif %}>50</option>
            <option value="all" {% if per_page == 'all' %}selected{% endif %}>All</option>
        </select>
    </form>

    <div id="userTableSection"></div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
function fetchUsers(params = {}) {
    if (!params.page) params.page = 1;

    const queryString = new URLSearchParams(params).toString();
    const baseUrl = '/app/admin/';
    const newUrl = queryString ? `${baseUrl}?${queryString}` : baseUrl;
    window.history.pushState({}, '', newUrl);
    //window.history.pushState({}, '', baseUrl);

    $('#userTableSection').empty();

    $.ajax({
        url: "{% url 'spa_router' page='admin' %}",
        data: params,
        type: 'GET',
        headers: { "X-Requested-With": "XMLHttpRequest" },
        success: function(data) {
            if (data.success) {
                $('#userTableSection').prepend(
                    `<p><b>${data.search_count}</b> users found${params.search ? ` for "<b>${params.search}</b>"` : ''}</p>`
                );
                renderTable(data.users);
                renderPagination(data.pagination);
            } else {
                $('#userTableSection').html('<p>Error loading users. Please try again.</p>');
            }
        },
        error: function(xhr, status, error) {
            $('#userTableSection').html('<p>Error loading users. Please try again.</p>');
            console.error("Error:", error);
        }
    });
}


function renderTable(users) {
    let html = '<table>';
    html += '<thead><tr>';
    html += '<th>ID</th><th>First Name</th><th>Last Name</th><th>Username</th><th>Email</th><th>Address</th><th>District</th><th>State</th><th>Date of Birth</th><th>Actions</th>';
    html += '</tr></thead><tbody>';

    if (users.length === 0) {
        html += '<tr><td colspan="10">No users found.</td></tr>';
    } else {
        users.forEach(user => {
            html += `<tr>
                <td>${user.id}</td>
                <td>${user.first_name}</td>
                <td>${user.last_name}</td>
                <td>${user.username}</td>
                <td>${user.email}</td>
                <td>${user.address}</td>
                <td>${user.district}</td>
                <td>${user.state}</td>
                <td>${user.date_of_birth || ''}</td>
                <td>
        <a href="#" class="deleteUserBtn" data-id="${user.id}" data-username="${user.username}">Delete</a>

                </td>
            </tr>`;
        });
    }
    html += '</tbody></table>';

    $('#userTableSection').append('<div class="table-responsive">' + html + '</div>');
}

function renderPagination(pagination) {
    let html = '<div class="pagination">';
    if (pagination.has_previous) {
        html += `<a href="#" class="pagelink" data-page="${pagination.current_page - 1}">Previous</a>`;
    }
    html += `<span>Page ${pagination.current_page} of ${pagination.total_pages}</span>`;
    if (pagination.has_next) {
        html += `<a href="#" class="pagelink" data-page="${pagination.current_page + 1}">Next</a>`;
    }
    html += '</div>';

    $('#userTableSection').append(html);
}

$(document).ready(function() {
    // Initial fetch with values from template context
    fetchUsers({
        search: "{{ search_query|escapejs }}",
        per_page: "{{ per_page|escapejs }}",
        page: 1,
    });

    $('#filterForm').on('submit', function(e) {
        e.preventDefault();
        const search = $('#searchInput').val();
        const per_page = $('#perPageSelect').val();
        fetchUsers({ search, per_page, page: 1 });
    });

    $('#perPageSelect').on('change', function() {
        const search = $('#searchInput').val();
        const per_page = $('#perPageSelect').val();
        fetchUsers({ search, per_page, page: 1 });
    });

    $(document).on('click', '.pagelink', function(e) {
        e.preventDefault();
        const page = $(this).data('page');
        const search = $('#searchInput').val();
        const per_page = $('#perPageSelect').val();
        fetchUsers({ page, search, per_page });
    });
});
</script>
{% endblock %}
