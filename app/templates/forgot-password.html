{% extends 'index.html' %}

{% block main_content %}
<div class="main">
  <div class="middle">
    <div class="name">
      <h2>Forgot Password</h2>
    </div>

    {% if message %}
    <div class="msg">
      <p>{{ message }}</p>
    </div>
    {% endif %}

    <div class="usename">
<form id="forgotPasswordForm" method="POST" action="/app/forgot-password/">
  {% csrf_token %}
  <input type="text" name="username" placeholder="Enter username" required />
  <button type="submit">Send Reset Link</button>
</form>

<div id="forgotPasswordMessage" class="alert mt-2 d-none"></div>

    </div>
  </div>
</div>
{% endblock %}
