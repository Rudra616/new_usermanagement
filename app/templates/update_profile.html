
{% block main_content %}
<div class="container my-4">
    <div class="row">
        <div class="col">
            <h2>Welcome, {{ username.firstName }} {{ username.lastName }}</h2>
        </div>
    </div>

    <div id="ajaxResponseMessage" class="mb-3"></div>

    <form id="updateProfileForm" data-url="{% url 'spa_router' 'update_profile' %}" enctype="multipart/form-data" class="border p-4 rounded shadow-sm">
        {% csrf_token %}

        <div class="row mb-3">
            <div class="col">
                <label for="first_name" class="form-label">First Name:</label>
                <input type="text" name="first_name" class="form-control" id="first_name" value="{{ username.firstName }}">
                <small class="error text-danger"></small>
            </div>
            <div class="col">
                <label for="last_name" class="form-label">Last Name:</label>
                <input type="text" name="last_name" class="form-control" id="last_name" value="{{ username.lastName }}">
                <small class="error text-danger"></small>
            </div>
        </div>

        <div class="mb-3">
            <label for="username" class="form-label">Username (read-only):</label>
            <input type="text" name="username" class="form-control" id="username" value="{{ username.userName }}" readonly>
        </div>

        <div class="mb-3">
            <label for="email" class="form-label">Email:</label>
            <input type="email" name="email" class="form-control" id="email" value="{{ username.email }}">
            <small class="error text-danger"></small>
        </div>

        <div class="row mb-3">
            <div class="col">
                <label for="phone_number" class="form-label">Phone Number:</label>
                <input type="text" name="phone_number" class="form-control" id="phone_number" value="{{ username.phoneNumber }}">
                <small class="error text-danger"></small>
            </div>
            <div class="col">
                <label for="address" class="form-label">Address:</label>
                <input type="text" name="address" class="form-control" id="address" value="{{ username.address }}">
                <small class="error text-danger"></small>
            </div>
        </div>

        <div class="mb-3">
            <label for="date_of_birth" class="form-label">Date of Birth:</label>
            <input type="date" name="date_of_birth" class="form-control" id="date_of_birth"
                {% if username.dateOfBirth %} value="{{ username.dateOfBirth|date:'Y-m-d' }}" {% endif %}>
            <small class="error text-danger"></small>
        </div>

        <div class="row mb-3">
            <div class="col">
                <label for="state" class="form-label">State:</label>
                <select id="state" name="state" class="form-select">
                    <option value="">Select State</option>
                    {% for state in states %}
                    <option value="{{ state.id }}" {% if username.state and username.state.id == state.id %}selected{% endif %}>{{ state.name }}</option>
                    {% endfor %}
                </select>
                <small class="error text-danger"></small>
            </div>

            <div class="col">
                <label for="district" class="form-label">District:</label>
                <select id="district" name="district" class="form-select">
                    <option value="">Select District</option>
                    {% for district in districts %}
                    <option value="{{ district.id }}" {% if username.district and username.district.id == district.id %}selected{% endif %}>{{ district.name }}</option>
                    {% endfor %}
                </select>
                <small class="error text-danger"></small>
            </div>
        </div>
{% comment %} 
        <div class="mb-3">
            {% if username.image %}
            <img src="{{ username.image.url }}" alt="User Image" class="img-thumbnail mb-2" width="120">
            {% endif %}
            <label for="image" class="form-label">Upload New Image:</label>
            <input type="file" name="image" id="image" class="form-control">
        </div> {% endcomment %}

        <div class="text-center">
            <button type="submit" class="btn btn-primary w-50" id="submitBtn">Update Profile</button>
        </div>
    </form>
</div>
{% endblock %}
