{% load static %}
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>WELDORK - Home</title>

    <!-- Favicon -->
    <link href="{% static 'img/favicon.ico' %}" rel="icon" />

    <!-- Google Web Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Roboto:wght@700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Icon Font Stylesheet -->
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.4/font/bootstrap-icons.css"
    />

    <!-- Libraries Stylesheet -->
    <link href="{% static 'lib/animate/animate.min.css' %}" rel="stylesheet" />
    <link
      href="{% static 'lib/owlcarousel/assets/owl.carousel.min.css' %}"
      rel="stylesheet"
    />

    <!-- Customized Bootstrap Stylesheet -->
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet" />

    <!-- Template Stylesheet -->
    <link href="{% static 'css/style.css' %}" rel="stylesheet" />

    {% block css %}{% endblock %}
  </head>
  <body>
    <!-- Spinner Start -->
    <div
      id="spinner"
      class="show bg-white position-fixed translate-middle w-100 vh-100 top-50 start-50 d-flex align-items-center justify-content-center"
    >
      <div
        class="spinner-border text-primary"
        role="status"
        style="width: 3rem; height: 3rem"
      ></div>
    </div>
    <!-- Spinner End -->

    <!-- Navbar Start -->
    {% include 'nav.html' %}
    <!-- Navbar End -->

    <!-- Main Content Start -->
    <div id="main-content">
      {% block main_content %}
      {% include 'home.html' %}
      {% endblock %}
    </div>
    <!-- Main Content End -->

    <!-- Back to Top -->
    <a href="#" class="btn btn-lg btn-primary btn-lg-square back-to-top"
      ><i class="bi bi-arrow-up"></i
    ></a>

    <!-- JavaScript Libraries -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'lib/wow/wow.min.js' %}"></script>
    <script src="{% static 'lib/easing/easing.min.js' %}"></script>
    <script src="{% static 'lib/waypoints/waypoints.min.js' %}"></script>
    <script src="{% static 'lib/counterup/counterup.min.js' %}"></script>
    <script src="{% static 'lib/owlcarousel/owl.carousel.min.js' %}"></script>

    <!-- Template Javascript -->
    <script src="{% static 'js/main.js' %}"></script>

    <!-- AJAX & Navbar Update Script -->
    <script>
      // Function to initialize login form JS
      function initLoginForm() {
        $.ajaxSetup({
          headers: {
            "X-CSRFToken": $("input[name=csrfmiddlewaretoken]").val(),
          },
        });

        $("#loginInfo").off("submit").on("submit", function (e) {
          e.preventDefault();
          e.stopPropagation();

          $(".error").text("");
          $("#formMessage")
            .removeClass("alert-success alert-danger d-block")
            .addClass("d-none")
            .html("");

          let valid = true;
          const username = $("#name").val().trim();
          const password = $("#password").val().trim();
          const captcha = $("#captcha").val().trim();

          if (!username) {
            $("#name").siblings(".error").text("Username is required.");
            valid = false;
          }
          if (!password) {
            $("#password").siblings(".error").text("Password is required.");
            valid = false;
          }
          if (!captcha) {
            $("#captcha").siblings(".error").text("Captcha is required.");
            valid = false;
          }
          if (!valid) return false;

          showLoader();

          $.ajax({
            url: $("#loginInfo").attr("action"),
            type: "POST",
            data: $(this).serialize(),
            headers: {
              "X-Requested-With": "XMLHttpRequest",
            },
            success: function (response) {
              hideLoader();
              if (response.success && response.html) {
                $("#main-content").html(response.html);
                history.pushState({}, "", response.redirect_url);
                new WOW().init();

                // Dynamically update navbar after login
                $.ajax({
                  url: "/app/navbar/",
                  headers: { "X-Requested-With": "XMLHttpRequest" },
                  success: function (data) {
                    // Replace entire navbar container (not just nav element)
                    $(".container-fluid.bg-white.sticky-top").replaceWith(
                      $(data.html).filter(".container-fluid.bg-white.sticky-top")
                    );
                  },
                  error: function () {
                    console.error("Failed to update navbar.");
                  },
                });
              } else {
                displayMessage("Unexpected response from server.", "danger");
              }
            },
            error: function () {
              hideLoader();
              displayMessage("Something went wrong. Try again.", "danger");
            },
          });

          return false;
        });

        // Captcha refresh button
        $("#refreshCaptchaBtn")
          .off("click")
          .on("click", function () {
            showLoader();
            $.ajax({
              url: "{% url 'refresh_captcha' %}",
              type: "GET",
              success: function (data) {
                if (data.captcha_code) {
                  $("#captchaImage").html(data.captcha_code);
                } else if (data.captcha) {
                  $("#captchaImage").html(data.captcha);
                }
              },
              error: function () {
                console.error("Error refreshing captcha.");
                displayMessage("Failed to refresh captcha.", "warning");
              },
              complete: function () {
                hideLoader();
              },
            });
          });

        function showLoader() {
          $("#formMessage")
            .removeClass("d-none")
            .addClass("alert alert-info d-block")
            .html("Loading...");
        }
        function hideLoader() {
          $("#formMessage")
            .addClass("d-none")
            .removeClass("alert alert-info d-block")
            .html("");
        }
        function displayMessage(msg, type) {
          const alertClass =
            type === "danger"
              ? "alert-danger"
              : type === "warning"
              ? "alert-warning"
              : "alert-success";
          $("#formMessage")
            .removeClass("d-none")
            .addClass("alert " + alertClass + " d-block")
            .html(msg);
        }
      }

      // AJAX page loading function
      function loadPage(url) {
        $.ajax({
          url: url,
          headers: { "X-Requested-With": "XMLHttpRequest" },
          success: function (data) {
            var htmlContent = data.html || data;
            var tempDiv = $("<div>").html(htmlContent);
            var newContent = tempDiv.find("#main-content").html();

            if (newContent) {
              $("#main-content").html(newContent);
            } else {
              $("#main-content").html(htmlContent);
            }

            new WOW().init();

            // Initialize login form if login page loaded
            if (url.includes("/login")) {
              initLoginForm();
            }
          },
          error: function () {
            alert("Failed to load page.");
          },
        });
      }

      $(document).ready(function () {
        new WOW().init();

        if (window.location.pathname.includes("/login")) {
          initLoginForm();
        }

        // Handle navbar link clicks with AJAX load
        $(document).on(
          "click",
          ".navbar-nav a#nav-item.nav-link, .navbar-nav .dropdown-menu a.dropdown-item",
          function (e) {
            e.preventDefault();

            var url = $(this).attr("href");
            if (url === window.location.pathname) {
              return; // already on page
            }

            loadPage(url);
            history.pushState(null, null, url);
          }
        );

        // Handle back/forward buttons
        window.onpopstate = function () {
          loadPage(location.pathname);
        };
      });
    </script>

    {% block script %}{% endblock %}
  </body>
</html>
