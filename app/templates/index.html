<style>
  /* Enhanced Spinner Styles with Modern Design */
  #spinner {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: rgba(0, 0, 0, 0.7);
    z-index: 99999;
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    backdrop-filter: blur(2px);
  }
  
  #spinner.show {
    opacity: 1;
    visibility: visible;
  }
  
  .spinner-content {
    text-align: center;
    padding: 2rem;
    border-radius: 12px;
    background-color: rgba(255, 255, 255, 0.9);
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    animation: fadeIn 0.3s ease-out;
  }
  
  .spinner-border {
    width: 3.5rem;
    height: 3.5rem;
    border-width: 0.3em;
    border-color: #4f46e5;
    border-right-color: transparent;
    animation: spin 0.75s linear infinite;
  }
  
  .spinner-text {
    margin-top: 1rem;
    font-size: 1.1rem;
    font-weight: 500;
    color: #374151;
    font-family: 'Poppins', sans-serif;
  }
  
  /* Animations */
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  /* Global loading indicator */
  .global-ajax-loading {
    cursor: wait;
  }
  
  .global-ajax-loading * {
    pointer-events: none;
  }
  .error{
    color:red;
  }
  .nav-link{
    cursor:pointer;
  }

  /* Responsive adjustments */
  @media (max-width: 768px) {
    .spinner-content {
      padding: 1.5rem;
      width: 90%;
      max-width: 300px;
    }
    
    .spinner-border {
      width: 2.5rem;
      height: 2.5rem;
    }
    
    .spinner-text {
      font-size: 1rem;
    }
  }
</style>
    {% block css %}{% endblock %}
  </head>
  <body>
    <!-- Spinner Start -->
    <div
      id="spinner"
      class="show bg-white position-fixed translate-middle w-100 vh-100 top-50 start-50 d-flex align-items-center justify-content-center"
    >
      <div
        class="spinner-border text-primary"
        role="status"
        style="width: 3rem; height: 3rem"
      ></div>
    </div>
    <!-- Spinner End -->
  <!-- Spinner Start -->
<div id="spinner">
